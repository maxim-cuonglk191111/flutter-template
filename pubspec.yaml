name: flutter_template
description: "Flutter Core Template — App Factory Boilerplate v1.1"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Routing
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  firebase_analytics: ^11.2.0
  firebase_crashlytics: ^4.0.3
  firebase_messaging: ^15.1.0
  firebase_remote_config: ^5.1.0
  cloud_firestore: ^5.2.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Monetization
  purchases_flutter: ^7.4.0   # RevenueCat
  google_mobile_ads: ^5.1.0   # AdMob

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.1

  # Networking
  dio: ^5.4.3+1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # ── v1.1 NEW ────────────────────────────────────────────────

  # Responsive sizing — use .sp / .w / .h everywhere
  flutter_screenutil: ^5.9.3

  # Localization — JSON-based, switch at runtime, no rebuild
  easy_localization: ^3.0.7

  # Skeleton loading states — wrap any widget
  skeletonizer: ^1.4.2

  # Secure storage — Android Keystore / iOS Keychain
  flutter_secure_storage: ^9.2.2

  # Environment variables — .env local dev / CI secrets prod
  flutter_dotenv: ^5.1.0

  # In-app update — prompt users to update from Play Store
  in_app_update: ^4.2.3

  # Icon pack — Iconsax Plus (linear/bold, consistent across apps)
  iconsax_plus: ^1.0.0

  # ── End v1.1 NEW ────────────────────────────────────────────

  # Utils
  intl: ^0.19.0
  logger: ^2.3.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true

  # ── easy_localization asset path ─────────────────────────────
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - l10n/                    # Localization JSON files

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
